name: dafeiyu
services:
  astrbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: dafeiyu-astrbot:662cd5dd-fnos
    container_name: dafeiyu-astrbot
    restart: unless-stopped
    env_file: ./secrets/runtime.env
    environment:
      TZ: Asia/Shanghai
      PYTHONPATH: /opt/dafeiyu-overrides:/AstrBot
      MEME_HOME: /AstrBot/data/plugin_data/meme_generator
    ports:
      - '127.0.0.1:6185:6185'
    volumes:
      - ./astrbot/data:/AstrBot/data
      - ./napcat/qq:/app/.config/QQ:ro
      - ./patches/dashscope_tts.py:/AstrBot/astrbot/core/provider/sources/dashscope_tts.py:ro
      - ./patches/stage.py:/AstrBot/astrbot/core/pipeline/result_decorate/stage.py:ro
      - ./patches/sitecustomize.py:/opt/dafeiyu-overrides/sitecustomize.py:ro
      - ./patches/dafeiyu_group_context.py:/opt/dafeiyu-overrides/dafeiyu_group_context.py:ro
      - ./patches/group_chat_context.py:/AstrBot/astrbot/builtin_stars/astrbot/group_chat_context.py:ro
      - ./patches/proactive_context_service.py:/AstrBot/data/plugins/astrbot_plugin_proactive_chat/core/services/context_service.py:ro
      - ./patches/omnidraw_custom_endpoint_impl.py:/AstrBot/data/plugins/astrbot_plugin_omnidraw/providers/custom_endpoint_impl.py:ro
    mem_limit: 3g
    cpus: 2.0
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      browser:
        condition: service_started
  napcat:
    image: mlikiowa/napcat-docker:v4.18.37
    container_name: dafeiyu-napcat
    restart: unless-stopped
    env_file: ./secrets/napcat.env
    environment:
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:6100:6099'
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
      - ./astrbot/data/temp:/AstrBot/data/temp:ro
    mem_limit: 2g
    cpus: 1.5
    logging: *logging
  browser:
    init: true
    build:
      context: ./browser
    image: dafeiyu-browser:662cd5dd-fnos
    container_name: dafeiyu-browser
    restart: unless-stopped
    env_file: ./secrets/browser.env
    environment:
      TZ: Asia/Shanghai
      HOME: /data/home
      BROWSER_MCP_HOST: 0.0.0.0
      BROWSER_MCP_PORT: '8010'
      BROWSER_HEADLESS: '1'
      BROWSER_CHROME_PATH: /usr/bin/chromium
      BROWSER_PROFILE_DIR: /data/profile
      BROWSER_MODEL: deepseek-flash
      BROWSER_MAX_STEPS: '8'
      BROWSER_TASK_TIMEOUT: '180'
      PYTHONUNBUFFERED: '1'
      ANONYMIZED_TELEMETRY: 'false'
    volumes:
      - ./browser/data:/data
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: 1.5
    logging: *logging
